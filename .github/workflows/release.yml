name: Release

# Manual-only for now: this workflow is intentionally inert until a human wires up
# the required secrets/vars below and enables it. It is modeled on this repo's
# existing .gitlab-ci.yml `build:image` job (container build + push), ported to
# GitHub Actions + GHCR.
on:
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/hugmesh-net/hugmesh-wiki-bff-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # This service depends on the private systems.hugmesh:hugmesh-commons artifact
      # (see settings.xml), historically resolved in CI from the org's GitLab Maven
      # Package Registry using a job-scoped CI_JOB_TOKEN (see .gitlab-ci.yml). That
      # token has no GitHub equivalent, so it must be supplied as a repo secret
      # (GITLAB_CI_JOB_TOKEN) before this workflow can build successfully; the
      # registry coordinates are passed through as build-args exactly as the
      # Dockerfile / settings.xml already expect.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            CI_API_V4_URL=${{ vars.CI_API_V4_URL }}
            GITLAB_GROUP_ID=${{ vars.GITLAB_GROUP_ID }}
          secrets: |
            ci_job_token=${{ secrets.GITLAB_CI_JOB_TOKEN }}
